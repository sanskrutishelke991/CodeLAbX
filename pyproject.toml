[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "venv",
    "env",
    "staticfiles",
    "media",
    "**/migrations/**",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
branch = true
source = [
    "accounts",
    "ai_tools",
    "assessments",
    "challenges",
    "codelabx",
    "community",
    "content",
    "dashboard",
    "learning",
    "intelligence",
    "notes",
    "practice",
    "progress",
]
omit = [
    "*/migrations/*",
    "*/tests.py",
    "manage.py",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = true
fail_under = 40
