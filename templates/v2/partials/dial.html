      <a class="slice s0" data-i="0" href="{% url 'dashboard:home' %}">Dashboard</a>
      <a class="slice s1" data-i="1" href="{% url 'content:library' %}">Learn</a>
      <a class="slice s2" data-i="2" href="{% url 'practice:task_list' %}">Practice</a>
      <a class="slice s3" data-i="3" href="{% url 'learning:roadmaps' %}">Roadmaps</a>

      <div class="dial-tab" aria-hidden="true">

          <path fill="none" stroke="currentColor" stroke-width="15" stroke-linejoin="round" d="M81 87.44 L47 87.44 L30 58 L47 28.56 L81 28.56"/>
