{% if page_obj and page_obj.paginator.num_pages > 1 %}
<nav class="d-flex justify-content-center align-items-center gap-2 mt-4" aria-label="Pagination">
    {% if page_obj.has_previous %}<a class="btn btn-sm btn-outline-light" href="?{{ request.GET.urlencode }}&page={{ page_obj.previous_page_number }}">Previous</a>{% endif %}
    <span class="text-muted small">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a class="btn btn-sm btn-outline-light" href="?{{ request.GET.urlencode }}&page={{ page_obj.next_page_number }}">Next</a>{% endif %}
</nav>
{% endif %}
