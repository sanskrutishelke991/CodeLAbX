{% load static %}
<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#6c5ce7">
    <meta name="robots" content="noindex">
    <title>Offline — CodeLabX</title>
    <link rel="manifest" href="{% static 'manifest.webmanifest' %}">
    <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/pwa-accessibility.css' %}">
</head>
<body>
    <main class="offline-shell" id="main-content">
        <img src="{% static 'icons/pwa-192.png' %}" width="96" height="96" alt="CodeLabX">
        <p class="offline-kicker">Offline</p>
        <h1>CodeLabX cannot reach the server</h1>
        <p>
            Reconnect to continue. Private dashboards, chats, assessments, and
            learning records are intentionally not cached for offline access.
        </p>
        <button type="button" class="btn btn-primary" data-offline-retry>Try again</button>
    </main>
    <script src="{% static 'js/offline.js' %}"></script>
</body>
</html>
